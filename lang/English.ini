; English Language Strings for Field Shuffle EM
; config.json
module_name = "Field Shuffle"
module_desc = "A REDCap External Module that puts fields into a random order."
module_docs = "README.md"
config_debug = "Enable the <b>debug mode</b> (outputs tons of information to the console)"
; Action tag descriptions
shuffle_fields_dataentry_desc = "Shuffles fields or fixed-order blocks on a data entry form. Apply this tag to an unvalidated <i>Text Box</i> field that stores the realized order. To reproduce the order shown to a survey participant, place both this tag and <code>@SHUFFLE-FIELDS-SURVEY</code> on the same storage field with exactly the same expression. See <code>@SHUFFLE-FIELDS-SURVEY</code> for expression syntax, block grouping, and replay behavior."
shuffle_fields_survey_desc = "Shuffles fields or fixed-order blocks within one already-rendered survey page. Apply this tag to an unvalidated <i>Text Box</i> field that stores the realized order; the storage field and every shuffled field must be on the same page. Supply a quoted, comma-separated field list, for example <code>@SHUFFLE-FIELDS-SURVEY=\"q1,q2,q3,q4\"</code>. Use matched, non-nested parentheses for fixed-order blocks, for example <code>@SHUFFLE-FIELDS-SURVEY=\"(q1,q2,q3),q4,q5,(q6,q7)\"</code>. Adding <code>@HIDDEN-SURVEY</code> and <code>@READONLY</code> to the storage field is recommended. A valid stored order is replayed; invalid stored data prevents reordering."
shuffle_fields_paged_desc = "Survey only. Shuffles complete field definitions among selected metadata slots <b>before</b> REDCap builds survey pages, while section-header positions and non-selected fields remain fixed. Enable REDCap's setting to display each section on a separate page. Apply this tag to an unvalidated <i>Text Box</i> order-storage field, for example <code>@SHUFFLE-FIELDS-PAGED=\"q1,q2,q3,q4,q5,q6\"</code>; adding <code>@HIDDEN-SURVEY</code> and <code>@READONLY</code> is recommended. Every expression item must be one field; parentheses and <code>~</code> are not supported. Selected fields may be scattered across pages. A generated order is stored and a valid stored order is replayed exactly; invalid stored data is rejected and logged rather than replaced."
shuffle_fields_paged_single_desc = "Survey only. Shuffles fields or parenthesized field groups as page units <b>before</b> REDCap builds survey pages; every realized unit becomes one page. Enable REDCap's setting to display each section on a separate page. Inside a group, commas preserve fixed sequence and <code>~</code> shuffles a subset, for example <code>@SHUFFLE-FIELDS-PAGED-SINGLE=\"q1,(q2,q3~q4),q5,q6\"</code>. Grouped fields must be contiguous. Non-selected fields between configured units split the configuration into independently shuffled regions. Apply this tag to an unvalidated <i>Text Box</i> order-storage field and add <code>@HIDDEN-SURVEY</code> and <code>@READONLY</code>; the hidden tag lets the module omit that control field from the survey layout. Fields controlled by this tag cannot also be controlled by <code>@SHUFFLE-FIELDS-SURVEY</code>. A generated order is stored and a valid stored order is replayed exactly; invalid stored data is rejected and logged rather than replaced."
shuffle_fields_sh_desc = "Optional companion to <code>@SHUFFLE-FIELDS-PAGED-SINGLE</code>. Place it on any field in a page unit to supply that unit's section header, for example <code>@SHUFFLE-FIELDS-SH=\"Question\"</code>. The first tagged field in original metadata order wins. Without an override, the first natural section header in the unit is used; if none exists, the module generates a blank page-breaking header. Ordinary REDCap piping such as <code>[header_source:label]</code> is supported, but live piping is not. This tag is ignored outside a <code>PAGED-SINGLE</code> unit."
